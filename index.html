<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aforo Evento Premium</title>
    <style>
        :root {
            --hombres-color: #3B82F6;
            --mujeres-color: #EC4899;
            --bg-cristal: rgba(20, 20, 25, 0.65);
            --borde-cristal: rgba(255, 255, 255, 0.15);
            --text-color: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('wall_cont.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            padding: 20px; 
        }

        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.65); z-index: 1;
        }

        .tarjeta {
            position: relative; z-index: 2;
            background: var(--bg-cristal);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--borde-cristal);
            border-radius: 24px; padding: 30px 25px;
            width: 100%; max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        /* --- CABECERA Y HERRAMIENTAS SUTILES --- */
        .cabecera {
            display: flex; flex-direction: column; align-items: center; margin-bottom: 25px;
        }
        
        .titulo { font-size: 1.2rem; letter-spacing: 3px; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; }

        .herramientas-pildora {
            display: flex; align-items: center; gap: 15px;
            background: rgba(0, 0, 0, 0.4); padding: 8px 20px;
            border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .crono-display { font-family: monospace; font-size: 1.2rem; font-weight: bold; color: #cbd5e1; width: 55px; text-align: center; }

        .btn-icono {
            background: none; border: none; font-size: 1.2rem; cursor: pointer;
            transition: 0.3s; opacity: 0.6; filter: grayscale(100%);
            display: flex; justify-content: center; align-items: center;
        }
        .btn-icono:hover { opacity: 1; filter: grayscale(0%); transform: scale(1.15); }
        .btn-icono.activo { opacity: 1; filter: grayscale(0%); }

        /* --- CONTADOR TOTAL ESTÉTICO --- */
        .total-wrapper { display: flex; justify-content: center; margin-bottom: 30px; }
        
        .total-circle {
            width: 160px; height: 160px; border-radius: 50%;
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 15px rgba(255,255,255,0.05);
        }
        
        .total-numero { 
            font-size: 5rem; font-weight: 900; line-height: 1; 
            background: linear-gradient(135deg, #60A5FA, #F472B6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        
        .total-texto { font-size: 1rem; font-weight: 600; color: rgba(255, 255, 255, 0.6); margin-top: 5px; text-transform: uppercase; letter-spacing: 2px;}

        /* --- CUADRÍCULA GÉNEROS --- */
        .grid-generos { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .caja-genero { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 20px 10px; text-align: center; }
        
        .icono-svg { width: 50px; height: 50px; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.4)); margin-bottom: 10px; }
        .svg-hombres { fill: var(--hombres-color); }
        .svg-mujeres { fill: var(--mujeres-color); }

        .titulo-genero { font-size: 0.85rem; letter-spacing: 1px; font-weight: bold; color: #94a3b8; }
        .numero-genero { font-size: 2.5rem; font-weight: bold; margin: 5px 0 15px 0; }

        /* Botones +1 y -1 */
        .botones { display: flex; justify-content: center; gap: 12px; }
        .btn-circular {
            border: none; border-radius: 50%; width: 42px; height: 42px;
            font-size: 1.5rem; font-weight: bold; color: white; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .btn-circular:active:not(:disabled) { transform: scale(0.9); }
        .btn-sumar-h { background-color: var(--hombres-color); box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3); }
        .btn-sumar-m { background-color: var(--mujeres-color); box-shadow: 0 4px 10px rgba(236, 72, 153, 0.3); }
        .btn-restar { background-color: transparent; border: 2px solid rgba(255, 255, 255, 0.2); }
        
        .btn-circular:disabled { opacity: 0.15; cursor: not-allowed; border-color: transparent; box-shadow: none; }

        /* --- ESTADÍSTICAS --- */
        .stats-container { background: rgba(0, 0, 0, 0.3); padding: 15px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .stats-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; display: flex; margin-bottom: 10px; }
        .stats-fill-h { background: var(--hombres-color); width: 0%; transition: width 0.4s ease; }
        .stats-fill-m { background: var(--mujeres-color); width: 0%; transition: width 0.4s ease; }
        .stats-labels { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .color-h { color: #60A5FA; }
        .color-m { color: #F472B6; }
    </style>
</head>
<body>

    <div class="overlay"></div>
    
    <div class="tarjeta">
        
        <!-- CABECERA SUTIL -->
        <div class="cabecera">
            <div class="titulo">Control de Aforo</div>
            <div class="herramientas-pildora">
                <button class="btn-icono" id="btn-toggle-crono" onclick="toggleCrono()" title="Iniciar/Pausar">▶️</button>
                <div class="crono-display" id="display-crono">00:00</div>
                <button class="btn-icono" onclick="guardarResultados()" title="Exportar Reporte">💾</button>
                <button class="btn-icono" onclick="resetearDatos()" title="Poner a cero">🔄</button>
            </div>
        </div>

        <!-- CONTADOR TOTAL ESTÉTICO -->
        <div class="total-wrapper">
            <div class="total-circle">
                <div class="total-numero" id="total">0</div>
                <!-- REGLA DE 0 PERSONAS VS 1 PERSONA -->
                <div class="total-texto" id="texto-personas">PERSONAS</div>
            </div>
        </div>

        <!-- CONTADORES DE GÉNERO -->
        <div class="grid-generos">
            
            <div class="caja-genero">
                <svg class="icono-svg svg-hombres" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M14 7h-4C8.9 7 8 7.9 8 9v6h2v7h4v-7h2V9c0-1.1-.9-2-2-2zm-2-5.75c1.24 0 2.25 1.01 2.25 2.25s-1.01 2.25-2.25 2.25S9.75 4.74 9.75 3.5 10.76 1.25 12 1.25z"/>
                </svg>
                <div class="titulo-genero">HOMBRES</div>
                <div class="numero-genero" id="hombres">0</div>
                <div class="botones">
                    <button class="btn-circular btn-restar" id="btn-restar-h" onclick="modificar('hombres', -1)" disabled>−</button>
                    <button class="btn-circular btn-sumar-h" onclick="modificar('hombres', 1)">+</button>
                </div>
            </div>

            <div class="caja-genero">
                <svg class="icono-svg svg-mujeres" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M13.94 8.31C13.62 7.52 12.85 7 12 7s-1.62.52-1.94 1.31L7 16h3.5v6h3v-6H17l-3.06-7.69zM12 1.25c1.24 0 2.25 1.01 2.25 2.25S13.24 5.75 12 5.75 9.75 4.74 9.75 3.5 10.76 1.25 12 1.25z"/>
                </svg>
                <div class="titulo-genero">MUJERES</div>
                <div class="numero-genero" id="mujeres">0</div>
                <div class="botones">
                    <button class="btn-circular btn-restar" id="btn-restar-m" onclick="modificar('mujeres', -1)" disabled>−</button>
                    <button class="btn-circular btn-sumar-m" onclick="modificar('mujeres', 1)">+</button>
                </div>
            </div>

        </div>

        <!-- ESTADÍSTICAS VISUALES -->
        <div class="stats-container">
            <div class="stats-bar">
                <div class="stats-fill-h" id="barra-h"></div>
                <div class="stats-fill-m" id="barra-m"></div>
            </div>
            <div class="stats-labels">
                <span class="color-h" id="pct-hombres">0% HOMBRES</span>
                <span class="color-m" id="pct-mujeres">0% MUJERES</span>
            </div>
        </div>

    </div>

    <script>
        let countHombres = 0;
        let countMujeres = 0;
        let segundos = 0;
        let cronoActivo = false;
        let intervalo = null;

        function modificar(genero, cantidad) {
            if (genero === 'hombres' && countHombres + cantidad >= 0) {
                countHombres += cantidad;
            } else if (genero === 'mujeres' && countMujeres + cantidad >= 0) {
                countMujeres += cantidad;
            }
            actualizarPantalla();
        }

        function actualizarPantalla() {
            let total = countHombres + countMujeres;

            document.getElementById('total').innerText = total;
            document.getElementById('hombres').innerText = countHombres;
            document.getElementById('mujeres').innerText = countMujeres;

            // REQUISITO: Cambio gramatical
            document.getElementById('texto-personas').innerText = (total === 1) ? 'PERSONA' : 'PERSONAS';

            // REQUISITO: Deshabilitar botones lógicamente
            document.getElementById('btn-restar-h').disabled = (countHombres === 0);
            document.getElementById('btn-restar-m').disabled = (countMujeres === 0);

            // Estadísticas
            let pctH = 0;
            let pctM = 0;
            if (total > 0) {
                pctH = Math.round((countHombres / total) * 100);
                pctM = Math.round((countMujeres / total) * 100);
            }
            
            document.getElementById('barra-h').style.width = pctH + '%';
            document.getElementById('barra-m').style.width = pctM + '%';
            document.getElementById('pct-hombres').innerText = pctH + '% HOMBRES';
            document.getElementById('pct-mujeres').innerText = pctM + '% MUJERES';
        }

        function toggleCrono() {
            const btn = document.getElementById('btn-toggle-crono');
            if (cronoActivo) {
                clearInterval(intervalo);
                btn.innerText = "▶️";
                btn.classList.remove('activo');
            } else {
                intervalo = setInterval(actualizarCrono, 1000);
                btn.innerText = "⏸️";
                btn.classList.add('activo');
            }
            cronoActivo = !cronoActivo;
        }

        function actualizarCrono() {
            segundos++;
            const m = String(Math.floor(segundos / 60)).padStart(2, '0');
            const s = String(segundos % 60).padStart(2, '0');
            document.getElementById('display-crono').innerText = `${m}:${s}`;
        }

        function resetearDatos() {
            if (confirm("¿Poner los contadores a cero?")) {
                countHombres = 0;
                countMujeres = 0;
                segundos = 0;
                
                clearInterval(intervalo);
                cronoActivo = false;
                document.getElementById('display-crono').innerText = "00:00";
                const btn = document.getElementById('btn-toggle-crono');
                btn.innerText = "▶️";
                btn.classList.remove('activo');

                actualizarPantalla();
            }
        }

        function guardarResultados() {
            let total = countHombres + countMujeres;
            let pctH = total > 0 ? Math.round((countHombres / total) * 100) : 0;
            let pctM = total > 0 ? Math.round((countMujeres / total) * 100) : 0;
            let tiempo = document.getElementById('display-crono').innerText;

            let contenido = `==== REPORTE DE AFORO ====\n`;
            contenido += `Fecha: ${new Date().toLocaleDateString()} - ${new Date().toLocaleTimeString()}\n`;
            contenido += `Tiempo activo: ${tiempo}\n`;
            contenido += `==========================\n`;
            contenido += `TOTAL ASISTENTES: ${total}\n\n`;
            contenido += `HOMBRES: ${countHombres} (${pctH}%)\n`;
            contenido += `MUJERES: ${countMujeres} (${pctM}%)\n`;

            const blob = new Blob([contenido], { type: 'text/plain' });
            const enlace = document.createElement('a');
            enlace.href = URL.createObjectURL(blob);
            enlace.download = `Reporte_${Date.now()}.txt`;
            document.body.appendChild(enlace);
            enlace.click();
            document.body.removeChild(enlace);
        }
    </script>
</body>
</html>
